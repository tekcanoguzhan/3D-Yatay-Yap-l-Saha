<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diskordans Arazi Modelleri</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
</script>

<style>
body {
  margin: 0;
  background: #f1f5f9;
  font-family: Arial, sans-serif;
  text-align: center;
}

h2 {
  margin: 20px;
}

model-viewer {
  width: 100%;
  height: 65vh;
  background: #e2e8f0;
  margin-bottom: 30px;
}
</style>
</head>

<body>

<h2>Diskordans Arazi Modeli 1</h2>

<model-viewer
  src="DiskordansArazi1.glb"
  camera-controls
  auto-rotate
  autoplay
  shadow-intensity="1">
</model-viewer>

<h2>Diskordans Arazi Modeli 2</h2>

<model-viewer
  src="diskordanarazi2.glb"
  camera-controls
  auto-rotate
  autoplay
  shadow-intensity="1">
</model-viewer>

</body>
</html>

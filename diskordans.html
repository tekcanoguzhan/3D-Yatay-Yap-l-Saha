<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>3D Diskordans Modelleri</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
</script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  text-align: center;
}

h2 {
  margin: 20px 10px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 15px;
}

button {
  padding: 14px 20px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

model-viewer {
  width: 100%;
  height: 70dvh;
  background: #e2e8f0;
}

#status {
  padding: 10px;
}
</style>
</head>

<body>

<h2>3D Diskordans Arazi Modelleri</h2>

<div class="buttons">
  <button onclick="loadModel(1)">Model 1</button>
  <button onclick="loadModel(2)">Model 2</button>
</div>

<p id="status">Görüntülemek istediğiniz modeli seçin.</p>

<model-viewer
  id="viewer"
  camera-controls
  auto-rotate
  autoplay
  shadow-intensity="1"
  interaction-prompt="none">
</model-viewer>

<script>
const viewer = document.getElementById("viewer");
const status = document.getElementById("status");

const models = {
  1: "DiskordansArazi1.glb",
  2: "diskordanarazi2.glb"
};

function loadModel(number) {
  status.textContent = "Model yükleniyor, lütfen bekleyin...";
  viewer.removeAttribute("src");

  requestAnimationFrame(() => {
    viewer.src = models[number];
  });
}

viewer.addEventListener("load", () => {
  status.textContent = "Model hazır!";
});

viewer.addEventListener("error", () => {
  status.textContent = "Model yüklenemedi.";
});
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resifler - 3D Model</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f7;
      text-align: center;
    }
    h2 { padding: 12px; }
    model-viewer {
      width: 100%;
      height: 85vh;
      background: white;
    }
  </style>
</head>
<body>
  <h2>Resifler</h2>
  <model-viewer
    src="./Resifler.glb"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1">
  </model-viewer>
</body>
</html>

```html
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Coğrafya Modeli</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f5;
      text-align: center;
    }

    h2 {
      padding: 12px;
    }

    model-viewer {
      width: 100%;
      height: 75vh;
      min-height: 400px;
      background: white;
    }

    p {
      padding: 10px;
      color: #444;
    }
  </style>
</head>

<body>
  <h2>3D Coğrafya Modeli</h2>

  <model-viewer
    src="./model.glb"
    alt="Etkileşimli 3D coğrafya modeli"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1">
  </model-viewer>

  <p>Modeli döndürmek için dokunun veya fareyi kullanın.
  Yakınlaştırmak için parmaklarınızı ya da fare tekerleğini kullanın.</p>
</body>
</html>
```
